name: Update Google Scholar Stats

on:
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 08:00 UTC
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout google-scholar-stats branch
        uses: actions/checkout@v4
        with:
          ref: google-scholar-stats

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Crawl Google Scholar via SerpAPI
        env:
          SCHOLAR_ID: Zv_rC0AAAAAJ
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python google_scholar_crawler.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          git diff --staged --quiet || (git commit -m "Update Google Scholar stats" && git push)

      - name: Purge jsDelivr cache
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/xwlin-roy/xwlin-roy.github.io@google-scholar-stats/gs_data.json" > /dev/null
          curl -fsS "https://purge.jsdelivr.net/gh/xwlin-roy/xwlin-roy.github.io@google-scholar-stats/gs_data_shieldsio.json" > /dev/null
